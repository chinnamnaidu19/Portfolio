server:
  port: 0

spring:
  application:
    name: portfolio-backend-test

  sql:
    init:
      mode: never

  datasource:
    url: jdbc:h2:mem:portfolio_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

cors:
  allowed-origins: "*"

logging:
  level:
    root: WARN
    com.portfolio.backend: INFO
